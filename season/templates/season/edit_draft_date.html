{% extends "base.html" %}
{% block content %}
<div class="container mt-4" style="max-width:500px;">
    <h3>Update Draft Date &mdash; {{ game.name }}</h3>

    {% if messages %}
    {% for msg in messages %}
    <div class="alert alert-{{ msg.tags }}">{{ msg }}</div>
    {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Draft Date &amp; Time</label>
            <input type="datetime-local" name="draft_date" class="form-control"
                   value="{{ game.draft_date|date:'Y-m-d\TH:i'|default:'' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Draft Method</label>
            <select name="draft_method" class="form-select">
                {% if game.draft_method == 'straight' %}
                <option value="straight" selected>Straight</option>
                <option value="snake">Snake</option>
                {% else %}
                <option value="straight">Straight</option>
                <option value="snake" selected>Snake</option>
                {% endif %}
            </select>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">Update</button>
            <a href="{% url 'season_overall' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
